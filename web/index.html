<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Drone Map</title>
  <meta name="description" content="Live map of drones and missiles over Ukraine, fused from public Telegram monitoring channels.">
  <meta name="theme-color" content="#0d1014">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Drone Map">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/favicon.svg" alt="" width="26" height="26">
      <span>Drone Map</span>
    </div>
    <div id="status" class="status" title="Data status"><span class="dot"></span><span class="txt">Connecting…</span></div>
    <div id="summary" class="summary" aria-label="Active threats"></div>
    <div class="top-actions">
      <button id="installBtn" class="btn btn-accent" hidden>Install app</button>
      <button id="panelToggle" class="btn icon-btn" aria-label="Toggle panel" title="Panel">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div id="banners" class="banners" aria-live="polite"></div>

  <main class="layout">
    <div id="map" class="map" role="application" aria-label="Threat map"></div>

    <div id="filters" class="filters" role="toolbar" aria-label="Filter threat types"></div>

    <div class="map-controls">
      <button class="ctl" id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>
      <button class="ctl" id="zoomOut" aria-label="Zoom out" title="Zoom out">−</button>
      <button class="ctl" id="fitAll" aria-label="Show all targets" title="Show all targets">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="ctl" id="heatBtn" aria-label="Heatmap" title="Heatmap of the last 24 h / 7 days / 28 days" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2.5c.6 3.2 4.8 5.6 4.8 10.2A4.8 4.8 0 0 1 12 17.5a4.8 4.8 0 0 1-4.8-4.8c0-2 1-3.5 2.1-4.6.2 1.6 1 2.6 2 3.1-.4-3.2.1-6 .7-8.7Z" fill="currentColor"/><path d="M4 21h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="ctl" id="nearMe" aria-label="Alerts near me" title="Alerts near my location">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="3.5" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>

    <div id="nearAlert" class="near-alert" hidden></div>
    <button id="heatLegend" class="heat-legend" hidden></button>

    <aside id="panel" class="panel" aria-label="Details">
      <div class="sheet-handle" id="sheetHandle"><span></span></div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="targets" class="active">Targets <b id="tabCountTargets"></b></button>
        <button role="tab" data-tab="feed">Feed</button>
        <button role="tab" data-tab="history">Heatmap</button>
        <button role="tab" data-tab="alerts">Alerts <b id="tabCountAlerts"></b></button>
        <button role="tab" data-tab="sources">Sources</button>
      </nav>
      <section class="tab-body" id="tab-targets"></section>
      <section class="tab-body" id="tab-feed" hidden></section>
      <section class="tab-body" id="tab-history" hidden></section>
      <section class="tab-body" id="tab-alerts" hidden></section>
      <section class="tab-body" id="tab-sources" hidden></section>
      <section class="tab-body" id="detail" hidden></section>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet-heat/leaflet-heat.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
