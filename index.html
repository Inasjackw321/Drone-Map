<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0a0e27; color: white; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 2rem; text-align: center; }
        .header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .controls { padding: 1rem; background: #16213e; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; background: #667eea; color: white; font-size: 1rem; cursor: pointer; }
        .btn:hover { background: #5568d3; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; padding: 2rem; }
        .stat-card { background: #16213e; padding: 1.5rem; border-radius: 12px; text-align: center; border: 2px solid #667eea; }
        .stat-card h3 { font-size: 2.5rem; color: #667eea; margin-bottom: 0.5rem; }
        .stat-card p { color: #a0a0a0; }
        #map { width: 100%; height: 600px; margin: 0; }
        .map-container { padding: 0; }
        .sightings { padding: 2rem; }
        .sightings h2 { margin-bottom: 1rem; }
        .sighting-item { background: #16213e; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; border-left: 4px solid #667eea; }
        .sighting-item h4 { margin-bottom: 0.5rem; color: #667eea; }
        .footer { text-align: center; padding: 2rem; background: #0f3460; }
        .loading { text-align: center; padding: 2rem; color: #667eea; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛰️ Drone Tracker</h1>
        <p>Live Drone Sightings</p>
    </div>

    <div class="controls">
        <button id="refreshBtn" class="btn">🔄 Refresh Data</button>
    </div>

    <div class="stats">
        <div class="stat-card">
            <h3 id="totalSightings">-</h3>
            <p>Total Sightings</p>
        </div>
        <div class="stat-card">
            <h3 id="last24h">-</h3>
            <p>Last 24 Hours</p>
        </div>
    </div>

    <div class="map-container">
        <div id="map"></div>
    </div>

    <div class="sightings">
        <h2>📋 Recent Sightings</h2>
        <div id="sightingsList">
            <div class="loading">Loading drone data...</div>
        </div>
    </div>

    <div class="footer">
        <p>Last updated: <span id="lastUpdate">-</span></p>
        <p>Report drones via Telegram bot: <strong>@YourBotUsername</strong></p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script>
        let map, markers = [], heatLayer;
        const DATA_URL = 'https://raw.githubusercontent.com/Inasjackw321/Drone-Map/claude/connect-th-011CV1rP4pSCsJfhq5XoR6yw/drone_data.json';

        function init() {
            map = L.map('map').setView([50.4501, 30.5234], 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            document.getElementById('refreshBtn').addEventListener('click', loadData);

            loadData();
            setInterval(loadData, 60000); // Refresh every minute
        }

        async function loadData() {
            try {
                const response = await fetch(DATA_URL + '?t=' + Date.now());
                const data = await response.json();

                updateStats(data.sightings);
                updateMap(data.sightings);
                updateSightings(data.sightings);
                document.getElementById('lastUpdate').textContent = new Date().toLocaleString();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('sightingsList').innerHTML =
                    '<div class="loading">No drone sightings yet. Report via Telegram!</div>';
            }
        }

        function updateStats(sightings) {
            const now = Date.now();
            const last24h = sightings.filter(s => {
                const time = new Date(s.timestamp).getTime();
                return (now - time) < 86400000;
            }).length;

            document.getElementById('totalSightings').textContent = sightings.length;
            document.getElementById('last24h').textContent = last24h;
        }

        function updateMap(sightings) {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            if (heatLayer) map.removeLayer(heatLayer);

            if (sightings.length === 0) return;

            const heatData = [];

            sightings.forEach(s => {
                const icon = L.divIcon({
                    html: `<div style="background: #667eea; width: 20px; height: 20px; border-radius: 50%; border: 2px solid white;"></div>`,
                    iconSize: [20, 20]
                });

                const marker = L.marker([s.lat, s.lon], { icon }).addTo(map);
                marker.bindPopup(`
                    <b>${s.type}</b><br>
                    ${s.description}<br>
                    <small>${new Date(s.timestamp).toLocaleString()}</small>
                `);
                markers.push(marker);
                heatData.push([s.lat, s.lon, 0.5]);
            });

            if (heatData.length > 0) {
                heatLayer = L.heatLayer(heatData, { radius: 25, blur: 35 }).addTo(map);
                const group = L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        function updateSightings(sightings) {
            const list = document.getElementById('sightingsList');

            if (sightings.length === 0) {
                list.innerHTML = '<div class="loading">No drone sightings yet. Report via Telegram!</div>';
                return;
            }

            const recent = sightings.slice().reverse().slice(0, 10);

            list.innerHTML = recent.map(s => {
                const date = new Date(s.timestamp);
                const timeAgo = Math.floor((Date.now() - date.getTime()) / 60000);
                const timeStr = timeAgo < 60 ? `${timeAgo}m ago` :
                               timeAgo < 1440 ? `${Math.floor(timeAgo / 60)}h ago` :
                               `${Math.floor(timeAgo / 1440)}d ago`;

                return `
                    <div class="sighting-item">
                        <h4>🛸 ${s.type}</h4>
                        <p>📝 ${s.description}</p>
                        <p>📍 ${s.lat}, ${s.lon}</p>
                        <p>🕐 ${timeStr} | 👤 ${s.reporter}</p>
                    </div>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
