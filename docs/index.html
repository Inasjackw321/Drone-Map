<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([50.4501, 30.5234], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let markers = [];
        const DATA_URL = 'https://raw.githubusercontent.com/Inasjackw321/Drone-Map/claude/connect-th-011CV1rP4pSCsJfhq5XoR6yw/drone_data.json';

        async function loadData() {
            try {
                const res = await fetch(DATA_URL + '?t=' + Date.now());
                const data = await res.json();

                markers.forEach(m => map.removeLayer(m));
                markers = [];

                data.sightings.forEach(s => {
                    const marker = L.marker([s.lat, s.lon]).addTo(map);
                    marker.bindPopup(`<b>${s.type}</b><br>${s.description}<br><small>${new Date(s.timestamp).toLocaleString()}</small>`);
                    markers.push(marker);
                });

                if (markers.length > 0) {
                    const group = L.featureGroup(markers);
                    map.fitBounds(group.getBounds().pad(0.1));
                }
            } catch (e) {
                console.error('Error:', e);
            }
        }

        loadData();
        setInterval(loadData, 60000);
    </script>
</body>
</html>
